<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 游戏开发技术复习资料</title>
<style>
:root{--bg:#fbfaf6;--ink:#20242a;--sub:#5c6673;--line:#e4e0d6;--accent:#1f5f8b;--accent-soft:#eaf1f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;line-height:1.8}
.box{max-width:520px;padding:0 28px;text-align:center}
.code{font-size:64px;font-weight:700;color:var(--accent);letter-spacing:2px;line-height:1.1}
.code span{color:#c9c4b6}
h1{font-size:19px;margin:6px 0 10px;font-weight:600}
p{font-size:14px;color:var(--sub);margin:0 0 22px}
a{display:inline-block;text-decoration:none;font-size:14px;padding:9px 22px;border-radius:7px;
  background:var(--accent);color:#fff;transition:opacity .14s}
a:hover{opacity:.86}
.tip{margin-top:26px;font-size:12.5px;color:#8a939d;line-height:1.9}
</style>
</head>
<body>
<div class="box">
  <div class="code">4<span>0</span>4</div>
  <h1>这一页不存在</h1>
  <p>链接可能已经变更，或者地址里有拼写错误。</p>
  <a href="/unity-review/">回到资料索引</a>
  <div class="tip">如果你是从某个文件的链接点进来的，可能是文件名大小写不一致。<br>GitHub Pages 区分大小写，本地 Windows 不区分。</div>
</div>
</body>
</html>
